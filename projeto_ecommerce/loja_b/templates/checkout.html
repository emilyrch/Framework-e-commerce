<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        body {
            background: #c8c7fb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, serif;
        }

        .contenier {
            display: grid;
            max-width: 600px;
            height: 400px;
            margin-top: 160px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 20px;
            background-color: aliceblue;
            justify-content: center;
        }

        h1 {
            font-size: 36px;
        }

        select {
            border-radius: 10px;
            font-size: 14px;
            padding: 8px;
        }

        button {
            border-radius: 14px;
            padding: 14px;
            background-color: #009EE3;
            color: #ffffff;
            border: none;
            text-align: center;
            margin-left: 80px;
        }

        h1 img {
            width: 24px;
            height: 24px;
        }

        button img {
            width: 24px;
            height: 24px;
        }

        button:hover {
            background-color: #121139;
            cursor: pointer;
        }

        .mp {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        a {
            text-decoration: none;
            text-align: center;
            color: #121139;
        }

        a:hover {
            color: #009EE3;
        }

        .payment-message {
            margin-top: 20px;
            padding: 15px;
            background-color: #e0f7fa;
            border-radius: 10px;
            color: #004d40;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="contenier">
        <h1>Finalizar Compra <img src="https://img.icons8.com/?size=100&id=9671&format=png&color=000000"></h1>

        {% if message %}
            <div class="payment-message">
                <p>{{ message }}</p>
            </div>
        {% else %}
            <form method="post">
                <label>Forma de Pagamento:</label>
                <select name="payment_method" required>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="PIX">PIX</option>
                    <option value="Boleto">Boleto</option>
                </select>
                <br><br>
                <button type="submit">
                    <div class="mp">
                        Ir para MercadoPago <img src="https://img.icons8.com/?size=100&id=nTLVtpxsNPaz&format=png&color=000000">
                    </div>
                </button>
            </form>
        {% endif %}

        <a href="{{ url_for('index') }}">Voltar ao Início</a>
    </div>
</body>
</html>
